name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version in package.json
        id: bump
        run: |
          NEW=$(node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parts = pkg.version.split('.').map(Number);
            parts[2] += 1;
            pkg.version = parts.join('.');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log(pkg.version);
          ")
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Notify SoloDesk superproject to sync submodule pointer
        if: ${{ secrets.SUPERREPO_DISPATCH_TOKEN != '' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPERREPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SoloDeck/SoloDesk/dispatches \
            -d "{\"event_type\":\"submodule-updated\",\"client_payload\":{\"submodule\":\"web\",\"sha\":\"$(git rev-parse HEAD)\",\"version\":\"${{ steps.bump.outputs.new_version }}\"}}"
